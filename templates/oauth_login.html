<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login to Instagram</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wrap" style="max-width: 480px; text-align: center; padding-top: 80px;">
        <h1>🔐 Login to Instagram</h1>
        <p style="color: var(--text-muted); margin-bottom: 32px;">
            To download videos, you need to login to your Instagram account.
            This uses official OAuth - we never see your password.
        </p>
        <a href="{{ oauth_url }}" class="login-button">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Instagram_logo_2022.svg/50px-Instagram_logo_2022.svg.png" alt="Instagram" />
            Login with Instagram
        </a>
        <p style="margin-top: 20px; font-size: 12px; color: var(--text-muted);">
            You'll be redirected to Instagram to authorize this app.
        </p>
    </div>
</body>
</html>
