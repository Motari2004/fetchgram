<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Successful</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wrap" style="max-width: 480px; text-align: center; padding-top: 80px;">
        <div style="font-size: 64px;">✅</div>
        <h1>Login Successful!</h1>
        <p style="color: var(--text-muted); margin-bottom: 8px;">
            You are now logged in as <strong>@{{ username }}</strong>
        </p>
        <p style="color: var(--text-muted); margin-bottom: 32px;">
            You can now download videos from Instagram.
        </p>
        <a href="/" class="login-button" style="text-decoration: none;">
            Continue to App →
        </a>
        <p style="margin-top: 20px; font-size: 12px; color: var(--text-muted);">
            You will be automatically redirected in 3 seconds...
        </p>
    </div>
    <script>
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    </script>
</body>
</html>
