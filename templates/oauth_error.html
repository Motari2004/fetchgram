<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="wrap" style="max-width: 480px; text-align: center; padding-top: 80px;">
        <div style="font-size: 64px;">❌</div>
        <h1>Login Failed</h1>
        <p style="color: var(--error); margin-bottom: 8px;">
            <strong>Error:</strong> {{ error }}
        </p>
        <p style="color: var(--text-muted); margin-bottom: 32px;">
            {{ error_reason or 'Something went wrong. Please try again.' }}
        </p>
        <a href="/oauth/login" class="login-button" style="text-decoration: none;">
            Try Again →
        </a>
        <p style="margin-top: 20px; font-size: 12px; color: var(--text-muted);">
            If the problem persists, try logging in directly on Instagram first.
        </p>
    </div>
</body>
</html>
